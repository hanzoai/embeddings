name: Deploy Embeddings to DigitalOcean App Platform

on:
  push:
    branches: [ app-platform, main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_API_KEY }}

    - name: Deploy to DigitalOcean App Platform
      run: |
        doctl apps create --spec .do/app.yaml --wait || \
        doctl apps update hanzo-embeddings --spec .do/app.yaml --wait
      env:
        DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_API_KEY }}

    - name: Get app URL
      run: |
        APP_URL=$(doctl apps list --format Name,DefaultIngress --no-header | grep hanzo-embeddings | awk '{print $2}')
        echo "Embeddings API deployed at: https://$APP_URL"